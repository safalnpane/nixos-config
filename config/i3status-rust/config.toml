[theme]
theme = "gruvbox-dark"

[icons]
icons = "awesome6"

[[block]]
block = "cpu"
interval = 2

[[block]]
block = "memory"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60
warning = 20.0
alert = 10.0

[[block]]
block = "net"

[[block]]
block = "sound"

[[block]]
block = "time"
interval = 30
format = " $timestamp.datetime(f:'%a %d %b %R') "
